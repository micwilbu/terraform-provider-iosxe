---
name: Controller
path: /Cisco-IOS-XE-native:native/controller/Cisco-IOS-XE-controller:controller-tx-ex-list[name=%v][number=%v]
doc_category: Interface
# Requires a physical T1/E1 NIM; gate acceptance tests behind the TDM env var.
test_tags: [TDM]
no_delete: true
attributes:
  - yang_name: name
    tf_name: type
    id: true
    example: T1
  - yang_name: number
    id: true
    example: "0/1/0"
  - yang_name: framing-config/tx-framing
    tf_name: framing
    exclude_test: true
    example: esf
  # E1 framing (`when ../../name = 'E1'`); excluded from the T1 example test.
  - yang_name: framing-config/e1-framing
    tf_name: e1_framing
    exclude_test: true
    example: crc4
  - yang_name: pri-group/timeslots
    tf_name: pri_group_timeslots
    exclude_test: true
    example: "1-24"
